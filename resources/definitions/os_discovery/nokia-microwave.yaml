mib: IF-MIB:OPTICSIM-RADIO-TRS-COMMON-MIB
modules:
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - radioPDHTTPBidUserLabel
                        - ifDescr

        state:
            data:
                -
                    oid: opticsIMActiveAbnCond
                    num_oid: '.1.3.6.1.4.1.637.54.1.1.3.1.530.1.0'
                    descr: 'Abnormal Condition'
                    group: 'Alarms'
                    states:
                        - { value: 0, generic: 1, graph: 0, descr: Minor }
                        - { value: 1, generic: 2, graph: 0, descr: Major }
                        - { value: 2, generic: 0, graph: 0, descr: Clear }


